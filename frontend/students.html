<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Student</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>Student Management Portal</h1><p>Student Registration</p></header>
<main class="container">
  <h2>Add New Student</h2>
  <form id="studentForm">
    <label for="roll">Roll Number</label><input id="roll" maxlength="20" required>
    <label for="name">Student Name</label><input id="name" maxlength="100" required>
    <label for="email">Email Address</label><input id="email" type="email" maxlength="100" required>
    <label for="phone">Phone Number</label><input id="phone" type="tel" maxlength="15" required>
    <label for="course">Course</label>
    <select id="course" required>
      <option value="">Select Course</option>
      <option>B.Sc Computer Science</option><option>BCA</option><option>B.Tech</option><option>Other</option>
    </select>
    <label for="semester">Semester</label>
    <select id="semester" required>
      <option value="">Select Semester</option>
      <option value="1">1st Semester</option><option value="2">2nd Semester</option>
      <option value="3">3rd Semester</option><option value="4">4th Semester</option>
      <option value="5">5th Semester</option><option value="6">6th Semester</option>
      <option value="7">7th Semester</option><option value="8">8th Semester</option>
    </select>
    <button type="submit">Save Student</button>
  </form>
  <p id="message" class="message" role="status"></p>
  <div class="buttons">
    <a href="/dashboard.html">Dashboard</a><a href="/view_students.html">View Students</a>
    <button type="button" onclick="logout()">Logout</button>
  </div>
</main>
<footer>Student Management Portal | College Project</footer>
<script src="/students.js"></script><script src="/logout.js"></script>
</body>
</html>
