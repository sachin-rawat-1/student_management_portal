<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Students</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>Student Management Portal</h1><p>Student Records</p></header>
<main class="container">
  <h2>All Students</h2>
  <input type="search" id="searchStudent" placeholder="Search by roll number, name, or course" aria-label="Search students">
  <div class="table-wrapper">
    <table>
      <thead><tr><th>Roll No.</th><th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Semester</th><th>Actions</th></tr></thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>
  <p id="recordCount" class="message"></p>
  <p id="message" class="message" role="status"></p>
  <div class="buttons"><a href="/students.html">Add Student</a><a href="/dashboard.html">Dashboard</a><button onclick="logout()">Logout</button></div>
</main>
<footer>Student Management Portal | College Project</footer>
<script src="/view_students.js"></script><script src="/logout.js"></script>
</body>
</html>
